<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>LearM — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        text-align: center;
        background: radial-gradient(circle at 50% 30%, #e3f0ff, #fff 60%);
        color: #0b1526;
        font: 18px system-ui;
      }
      main {
        padding: 24px;
        max-width: 420px;
      }
      h1 {
        font-size: 42px;
      }
      span {
        color: #0b6fd8;
      }
      button {
        background: linear-gradient(135deg, #0b63d6, #1f97ff);
        color: #fff;
        box-shadow: 0 10px 34px -8px rgb(30 140 255 / 65%);
        border: 0;
        border-radius: 16px;
        padding: 16px 24px;
        font: inherit;
        cursor: pointer;
      }
      html[data-theme='dark'] body {
        background: radial-gradient(
          circle at 50% 30%,
          rgb(30 130 255 / 20%),
          #05070c 60%
        );
        color: #eef5ff;
      }
      html[data-theme='dark'] span {
        color: #42adff;
      }
    </style>
    <script>
      try {
        var t = localStorage.getItem('lingua-theme');
        document.documentElement.dataset.theme =
          t !== 'light' ? 'dark' : 'light';
      } catch {}
    </script>
  </head>
  <body>
    <main>
      <h1>Lear<span>M</span></h1>
      <p>Нет подключения к интернету</p>
      <p>Подключитесь к сети, чтобы продолжить обучение.</p>
      <button onclick="location.reload()">Попробовать снова</button>
    </main>
  </body>
</html>
